version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: xaiguard-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xaiguard-network

  redis:
    image: redis:7.2-alpine
    container_name: xaiguard-redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - xaiguard-network

  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: xaiguard-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - xaiguard-network

  createbuckets:
    image: minio/mc
    container_name: xaiguard-createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio http://minio:9000 admin password123;
      /usr/bin/mc mb myminio/mlflow;
      /usr/bin/mc anonymous set public myminio/mlflow;
      exit 0;
      "
    networks:
      - xaiguard-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    container_name: xaiguard-mlflow
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://postgres:password@postgres:5432/postgres
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
    ports:
      - "5500:5000"
    networks:
      - xaiguard-network

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  xaiguard-network:
    driver: bridge
