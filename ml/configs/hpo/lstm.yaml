# XAI-Guard HPO Configuration: Long Short-Term Memory (LSTM)
# -----------------------------------------------------------
# Role: Evaluates temporal sequence dependencies in network flows (RQ2).
# Assesses if recurrent memory detects slow-rate attacks (e.g., Slowloris) better than Trees.

optimization:
  engine: "Optuna"
  sampler: "TPESampler"
  trials: 40
  metric: "val_f1_macro"
  direction: "maximize"

validation_strategy:
  # Sequential data requires chronological splitting, not random K-Fold.
  method: "TimeSeriesSplit" 
  folds: 3

training_dynamics:
  epochs: 50
  early_stopping_patience: 10
  gradient_clipping: 1.0  # Prevents exploding gradients common in RNNs

hyperparameters:
  # Dimensionality of the output space.
  hidden_size:
    type: "int"
    choices: [64, 128, 256, 512]
    
  # Number of recurrent layers.
  num_layers:
    type: "int"
    low: 1
    high: 4
    
  # AdamW learning rate.
  learning_rate:
    type: "float"
    low: 1e-4
    high: 1e-2
    scale: "log"
    
  # Dropout probability applied between LSTM layers.
  dropout:
    type: "float"
    low: 0.1
    high: 0.5
    
  # Mini-batch size.
  batch_size:
    type: "categorical"
    choices: [256, 512, 1024]
