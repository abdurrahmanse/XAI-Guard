optimizer: Optuna
trials: 30
validation: Epoch-based
early_stopping_patience: 5
params:
  hidden_size:
    type: int
    choices:
    - 64
    - 128
    - 256
  num_layers:
    type: int
    range:
    - 1
    - 3
  learning_rate:
    type: float
    range:
    - 0.0001
    - 0.01
    scale: log
  dropout:
    type: float
    range:
    - 0.1
    - 0.5
  batch_size:
    type: int
    choices:
    - 128
    - 256
    - 512
