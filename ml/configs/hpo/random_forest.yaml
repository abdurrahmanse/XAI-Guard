# XAI-Guard HPO Configuration: Random Forest Classifier
# -----------------------------------------------------------
# Role: Classical ensemble baseline. Highly interpretable via Gini importance
# and robust to the severe class imbalances found in CICIDS-2017.

optimization:
  # Tree-Parzen Estimator (TPE) is highly efficient for tree-based discrete spaces.
  engine: "Optuna"
  sampler: "TPESampler"
  trials: 50
  metric: "f1_macro"
  direction: "maximize"
  n_jobs: -1  # Utilize all CPU cores

validation_strategy:
  method: "StratifiedKFold"
  folds: 5
  shuffle: true

hyperparameters:
  # Number of trees in the forest. High upper bound to prevent overfitting.
  n_estimators:
    type: "int"
    low: 100
    high: 1000
    step: 50
    
  # Maximum depth of the tree. Constrained to prevent memory bloat on edge deployment.
  max_depth:
    type: "int"
    low: 10
    high: 50
    
  # Minimum number of samples required to split an internal node.
  min_samples_split:
    type: "int"
    low: 2
    high: 20
    
  # Minimum number of samples required to be at a leaf node.
  min_samples_leaf:
    type: "int"
    low: 1
    high: 10
    
  # Balanced subsample to aggressively counter CICIDS-2017 class imbalance.
  class_weight:
    type: "categorical"
    choices: ["balanced", "balanced_subsample"]
