# XAI-Guard HPO Configuration: Full Transformer Encoder
# -----------------------------------------------------------
# Role: Evaluates the raw predictive power of self-attention on tabular network data.
# Will be heavily penalized in the CDS score for its latency and GPU-hour cost (RQ3).

optimization:
  engine: "Optuna"
  sampler: "TPESampler"
  trials: 30
  metric: "val_f1_macro"
  direction: "maximize"

validation_strategy:
  method: "StratifiedKFold"
  folds: 3

training_dynamics:
  epochs: 100
  early_stopping_patience: 15
  # Required to fit massive attention matrices in GPU memory during training
  mixed_precision: true
  gradient_clipping: 1.0

hyperparameters:
  # Dimension of the attention embeddings.
  d_model:
    type: "categorical"
    choices: [256, 512, 1024]
    
  # Number of multi-head attention heads.
  nhead:
    type: "categorical"
    choices: [4, 8, 16]
    
  # Number of sequential Transformer Encoder layers.
  num_layers:
    type: "int"
    low: 3
    high: 8
    
  # Dimension of the feedforward network model inside the encoder.
  dim_feedforward:
    type: "categorical"
    choices: [1024, 2048, 4096]

  # AdamW learning rate.
  learning_rate:
    type: "float"
    low: 1e-5
    high: 5e-4
    scale: "log"
    
  # Linear warmup steps before cosine decay (critical for Transformer convergence).
  warmup_steps:
    type: "int"
    low: 1000
    high: 5000
