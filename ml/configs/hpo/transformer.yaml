optimizer: Optuna
trials: 30
validation: Epoch-based
early_stopping_patience: 5
mixed_precision: true
gradient_clipping: 1.0
params:
  d_model:
    type: int
    choices:
    - 128
    - 256
    - 512
  nhead:
    type: int
    choices:
    - 4
    - 8
  num_layers:
    type: int
    range:
    - 2
    - 6
  learning_rate:
    type: float
    range:
    - 1.0e-05
    - 0.001
    scale: log
  warmup_steps:
    type: int
    range:
    - 500
    - 2000
