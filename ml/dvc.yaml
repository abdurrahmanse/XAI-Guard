stages:
  download:
    cmd: python scripts/download_datasets.py
    deps:
      - scripts/download_datasets.py
    outs:
      - data/raw
      
  clean:
    cmd: python src/data/clean.py
    deps:
      - data/raw
      - src/data/clean.py
    outs:
      - data/interim
    metrics:
      - reports/cleaning_report.json:
          cache: false

  encode:
    cmd: python src/data/encode.py
    deps:
      - data/interim
      - src/data/encode.py
    params:
      - configs/preprocessing.yaml:
    outs:
      - data/processed

  features:
    cmd: python src/features/build_features.py
    deps:
      - data/processed
      - src/features/build_features.py
    outs:
      - data/features

  select:
    cmd: python src/features/select_features.py
    deps:
      - data/features
      - src/features/select_features.py
    outs:
      - data/selected

  split:
    cmd: python src/data/split.py
    deps:
      - data/selected
      - src/data/split.py
    outs:
      - data/splits/train
      - data/splits/val
      - data/splits/test
