[project]
name = "api"
version = "0.1.0"
description = "XAI-Guard FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.7",
    "celery>=5.4.0",
    "greenlet>=3.5.5",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "structlog>=26.1.0",
    "python-json-logger>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "ruff>=0.4.8"
]
